<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация · FocusCorgi</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Google Font для красоты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <!-- Иконки Font Awesome для глазика -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo svg {
            width: 48px;
            height: 48px;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        /* Контейнер для поля с глазом */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            padding-right: 45px; /* место для глазика */
        }

        .password-container input:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #4F46E5;
        }

        /* Обычное поле (не пароль) */
        .input-group input:not(.password-container input) {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .input-group input:not(.password-container input):focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .input-group input::placeholder {
            color: #aaa;
            font-size: 14px;
        }

        .hint {
            display: block;
            font-size: 12px;
            color: #888;
            margin-top: 4px;
            margin-left: 4px;
        }

        /* Сообщение об ошибке/успехе */
        .password-match {
            font-size: 12px;
            margin-top: 4px;
            margin-left: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .match-success {
            color: #10b981;
        }

        .match-error {
            color: #ef4444;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #4F46E5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            background: #4338CA;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #a5a5a5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #4F46E5;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .login-link a:hover {
            color: #4338CA;
            text-decoration: underline;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Логотип -->
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1 .45-1.41.81-1.41 1.36 0 .55.45.99 1 .99h.01c.55 0 1-.45 1-1 0-.17-.03-.33-.09-.48-.16-.39-.51-.71-1.01-.97-1.25-.64-1.81-1.46-1.81-2.54 0-1.38 1.06-2.5 2.5-2.5.7 0 1.32.28 1.78.74l.42-.42c.2-.2.51-.2.71 0 .2.2.2.51 0 .71l-.49.49c.24.44.38.95.38 1.48 0 1.38-1.06 2.5-2.5 2.5-.7 0-1.32-.28-1.78-.74l-.42.42c-.2.2-.51.2-.71 0-.2-.2-.2-.51 0-.71l.49-.49z" fill="#4F46E5"/>
                </svg>
            </div>

            <h2>Создать аккаунт</h2>
            <p class="subtitle">Начни свой путь к продуктивности ✨</p>

            <!-- Форма регистрации -->
            <form id="registerForm" onsubmit="return false;">
                <!-- Поле Username -->
                <div class="input-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username" placeholder="corgi_lover" required>
                </div>

                <!-- Поле Email -->
                <div class="input-group">
                    <label for="email">Электронная почта</label>
                    <input type="email" id="email" name="email" placeholder="hello@focuscorgi.com" required>
                </div>

                <!-- Поле Пароль (с глазом) -->
                <div class="input-group">
                    <label for="password">Пароль</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
                        <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <small class="hint">минимум 6 символов</small>
                </div>

                <!-- Поле Повторить пароль (с глазом) -->
                <div class="input-group">
                    <label for="confirmPassword">Повторите пароль</label>
                    <div class="password-container">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required minlength="6">
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <!-- Индикатор совпадения паролей -->
                    <div id="passwordMatchIndicator" class="password-match"></div>
                </div>

                <!-- Кнопка отправки -->
                <button type="submit" class="btn" id="submitBtn">Зарегистрироваться</button>
            </form>

            <!-- Подсказка для входа -->
            <p class="login-link">
                Уже есть аккаунт? <a href="auth.html">Войти</a>
            </p>
        </div>
    </div>

    <script>
        // Функция для показа/скрытия пароля
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Получаем элементы
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const matchIndicator = document.getElementById('passwordMatchIndicator');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('registerForm');

        // Функция проверки совпадения паролей
        function checkPasswordMatch() {
            const pass = password.value;
            const confirm = confirmPassword.value;
            
            // Если оба поля заполнены
            if (pass && confirm) {
                if (pass === confirm) {
                    matchIndicator.innerHTML = '<i class="fa-solid fa-check-circle"></i> Пароли совпадают';
                    matchIndicator.className = 'password-match match-success';
                    submitBtn.disabled = false;
                } else {
                    matchIndicator.innerHTML = '<i class="fa-solid fa-exclamation-circle"></i> Пароли не совпадают';
                    matchIndicator.className = 'password-match match-error';
                    submitBtn.disabled = true;
                }
            } else {
                // Если одно из полей пустое
                matchIndicator.innerHTML = '';
                submitBtn.disabled = false; // Разблокируем, пусть форма сама проверяет required
            }
        }

        // Слушаем изменения в полях паролей
        password.addEventListener('input', checkPasswordMatch);
        confirmPassword.addEventListener('input', checkPasswordMatch);

        // Обработка отправки формы
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Финальная проверка перед отправкой
            if (password.value !== confirmPassword.value) {
                alert('❌ Пароли не совпадают!');
                return;
            }
            
            if (password.value.length < 6) {
                alert('❌ Пароль должен быть минимум 6 символов');
                return;
            }

            // Здесь будет отправка на бэкенд через 3 месяца :)
            // Сейчас просто имитируем успешную регистрацию
    
            // Сохраняем в localStorage что пользователь залогинен (для демо)
            localStorage.setItem('user', JSON.stringify({
                username: username.value,
                email: email.value,
                isLoggedIn: true
            }));

            // После успешной регистрации
            if (Notification.permission === 'default') {
                Notification.requestPermission();
            }
            // Перенаправляем на главную
            window.location.href = 'index.html';
        });

        // При загрузке страницы проверяем (на всякий случай)
        checkPasswordMatch();
    </script>
</body>
</html>
