{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FocusCorgi{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fa-solid fa-paw"></i>
                <span>FocusCorgi</span>
            </div>
            <nav class="nav">
                <a href="{% url 'index' %}" class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}">
                    <i class="fa-solid fa-house"></i> Главная
                </a>
                <a href="#" id="authLink" class="nav-link">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span id="authLinkText">Авторизация</span>
                </a>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                <i class="fa-solid fa-moon"></i>
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <script>
        // ---------- Работа с токенами ----------
        function getAccessToken() {
            return localStorage.getItem('access_token');
        }
        
        function getUser() {
            const userStr = localStorage.getItem('user');
            if (userStr) {
                try {
                    return JSON.parse(userStr);
                } catch(e) {
                    return null;
                }
            }
            return null;
        }
        
        function clearTokens() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user');
        }
        
        // ПРОСТАЯ ПРОВЕРКА АВТОРИЗАЦИИ - проверяем наличие токена И user
        function isAuthenticated() {
            const token = getAccessToken();
            const user = getUser();
            // Пользователь авторизован, если есть токен И есть user (с любыми полями)
            return !!(token && user);
        }
        
        // Получить данные пользователя
        function getUserData() {
            return getUser();
        }
        
        // Обновление UI
        function updateAuthUI() {
            console.log('updateAuthUI вызван');
            const authLink = document.getElementById('authLink');
            const authLinkText = document.getElementById('authLinkText');
            const authIcon = authLink ? authLink.querySelector('i') : null;
            
            const authenticated = isAuthenticated();
            const user = getUserData();
            
            console.log('authenticated:', authenticated);
            console.log('user:', user);
            console.log('token:', getAccessToken());
            
            if (authLink && authLinkText && authIcon) {
                if (authenticated && user) {
                    authLinkText.textContent = user.username || 'Личный кабинет';
                    authIcon.className = 'fa-solid fa-user';
                    authLink.href = "{% url 'person' %}";
                    console.log('Пользователь авторизован:', user.username);
                } else {
                    authLinkText.textContent = 'Авторизация';
                    authIcon.className = 'fa-solid fa-right-to-bracket';
                    authLink.href = "{% url 'auth' %}";
                    console.log('Пользователь НЕ авторизован');
                }
            }
        }
        
        // ---------- Тёмная тема ----------
        const themeToggle = document.getElementById('themeToggle');
        
        function setTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                if (themeToggle) themeToggle.classList.add('dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                if (themeToggle) themeToggle.classList.remove('dark');
            }
        }
        
        function toggleTheme() {
            const currentTheme = localStorage.getItem('theme') || 'light';
            setTheme(currentTheme === 'light' ? 'dark' : 'light');
        }
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') setTheme('dark');
        if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
        
        // ЗАПУСКАЕМ ПРИ ЗАГРУЗКЕ
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM загружен');
            updateAuthUI();
        });
        
        // Экспортируем функции
        window.getAccessToken = getAccessToken;
        window.clearTokens = clearTokens;
        window.updateAuthUI = updateAuthUI;
        window.isAuthenticated = isAuthenticated;
        window.getUserData = getUserData;
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
